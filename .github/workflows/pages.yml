name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Monta o site (só arquivos públicos)
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r web _site/web
          mkdir -p _site/contador-carros
          cp contador-carros/index.html contador-carros/app.js contador-carros/style.css contador-carros/config.js _site/contador-carros/
          mkdir -p _site/detector-movimento
          cp detector-movimento/index.html detector-movimento/app.js detector-movimento/style.css detector-movimento/config.js _site/detector-movimento/
          mkdir -p _site/detector-queda
          cp detector-queda/index.html detector-queda/app.js detector-queda/style.css detector-queda/fall-logic.js _site/detector-queda/
          mkdir -p _site/avaliacao-cliente
          cp avaliacao-cliente/index.html avaliacao-cliente/app.js avaliacao-cliente/style.css avaliacao-cliente/expression-logic.js _site/avaliacao-cliente/
          mkdir -p _site/vitrine-maos
          cp vitrine-maos/index.html vitrine-maos/app.js vitrine-maos/style.css vitrine-maos/hand-logic.js _site/vitrine-maos/
          cp -r vendor _site/vendor
          cp -r shared _site/shared
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
